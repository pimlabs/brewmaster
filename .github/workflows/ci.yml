name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run test suites
        run: |
          set -euo pipefail
          for f in tests/test_*.sh; do
            echo "=== $f ==="
            bash "$f"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          shellcheck bin/brewmaster
          find lib/brewmaster -name "*.sh" | xargs shellcheck