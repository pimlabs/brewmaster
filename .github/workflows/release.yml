name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[$VERSION]" '
            $0 ~ /^## \[/ {
              if (capture) exit
              if (index($0, ver) > 0) { capture=1 }
              next
            }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: /tmp/release-notes.md

  update-formula:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          TAP="pimlabs/homebrew-brewmaster"
          PATH_="Formula/brewmaster.rb"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          SHA256="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"

          CURRENT="$(gh api "repos/$TAP/contents/$PATH_" --jq '.content' | base64 -d)"
          BLOB_SHA="$(gh api "repos/$TAP/contents/$PATH_" --jq '.sha')"

          NEW="$(printf '%s\n' "$CURRENT" \
            | sed -E "s#^( *url \").*(\")\$#\\1${URL}\\2#" \
            | sed -E "s#^( *sha256 \").*(\")\$#\\1${SHA256}\\2#" \
            | sed -E "s#^( *version \").*(\")\$#\\1${VERSION}\\2#" \
            | sed -E "s#^(.*assert_match \"brewmaster )[0-9]+\\.[0-9]+\\.[0-9]+(\".*)\$#\\1${VERSION}\\2#")"

          gh api -X PUT "repos/$TAP/contents/$PATH_" \
            -f message="brewmaster ${VERSION}" \
            -f content="$(printf '%s\n' "$NEW" | base64)" \
            -f sha="$BLOB_SHA" \
            -f branch="main"
